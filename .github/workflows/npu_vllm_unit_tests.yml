name: npu_vllm_unit_tests

run-name: NPU vLLM example tests (${{ github.ref_name }})

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/npu_vllm_unit_tests.yml"
      - "ci/**"
      - "examples/*vllm*.sh"
      - "tests/**"
      - "verl_speco/**"
      - "pyproject.toml"
      - "REQUIRED_VERL.txt"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/npu_vllm_unit_tests.yml"
      - "ci/**"
      - "examples/*vllm*.sh"
      - "tests/**"
      - "verl_speco/**"
      - "pyproject.toml"
      - "REQUIRED_VERL.txt"
  workflow_dispatch:
    inputs:
      run_training:
        description: Enable drafter collect/train/publish inside the example run
        required: true
        default: true
        type: boolean
      target_model:
        description: Target model path or HF id; falls back to SPECO_TARGET_MODEL
        required: false
        type: string
      eagle3_draft_model:
        description: EAGLE3 drafter path; falls back to SPECO_EAGLE3_DRAFT_MODEL
        required: false
        type: string
      dflash_draft_model:
        description: DFlash drafter path; falls back to SPECO_DFLASH_DRAFT_MODEL
        required: false
        type: string
      dspark_draft_model:
        description: DSpark drafter path; falls back to SPECO_DSPARK_DRAFT_MODEL
        required: false
        type: string
      train_file:
        description: Training dataset path; falls back to SPECO_TRAIN_FILE
        required: false
        type: string
      test_file:
        description: Validation dataset path; falls back to SPECO_TEST_FILE
        required: false
        type: string
      accelerator_count:
        description: Number of NPU devices
        required: false
        default: "8"
        type: string
      tensor_parallel_size:
        description: Rollout tensor parallel size
        required: false
        default: "1"
        type: string
      sequence_parallel_size:
        description: Actor/ref sequence parallel size
        required: false
        default: "1"
        type: string
      extra_hydra_args:
        description: Optional newline-separated Hydra overrides
        required: false
        type: string
  # schedule:
  #   - cron: "23 19 * * 3"

permissions:
  contents: read

concurrency:
  group: npu-vllm-example-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  SPECO_DEFAULT_TARGET_MODEL: ${{ vars.SPECO_TARGET_MODEL || '~/.cache/huggingface/Qwen3-8B' }}
  SPECO_DEFAULT_EAGLE3_DRAFT_MODEL: ${{ vars.SPECO_EAGLE3_DRAFT_MODEL || '~/.cache/huggingface/angelslim-qwen3-8b-eagle3' }}
  SPECO_DEFAULT_DFLASH_DRAFT_MODEL: ${{ vars.SPECO_DFLASH_DRAFT_MODEL || '~/.cache/huggingface/Qwen3-8B-Dflash-b16' }}
  SPECO_DEFAULT_DSPARK_DRAFT_MODEL: ${{ vars.SPECO_DSPARK_DRAFT_MODEL || '~/.cache/huggingface/dspark_qwen3_8b_block7' }}
  SPECO_DEFAULT_TRAIN_FILE: ${{ vars.SPECO_TRAIN_FILE || '~/.cache/huggingface/dapo-math-17k.parquet' }}
  SPECO_DEFAULT_TEST_FILE: ${{ vars.SPECO_TEST_FILE || '~/.cache/huggingface/aime-2024.parquet' }}
  SPECO_DEFAULT_ACCELERATOR_COUNT: ${{ vars.SPECO_ACCELERATOR_COUNT || '8' }}
  SPECO_DEFAULT_TENSOR_PARALLEL_SIZE: ${{ vars.SPECO_TENSOR_PARALLEL_SIZE || '1' }}
  SPECO_DEFAULT_SEQUENCE_PARALLEL_SIZE: ${{ vars.SPECO_SEQUENCE_PARALLEL_SIZE || '1' }}

jobs:
  example:
    name: NPU vLLM ${{ matrix.drafter }} example
    runs-on: [linux-aarch64-a2-8]
    container:
      image: swr.cn-north-4.myhuaweicloud.com/mindspeed/verl0.8.0_speco:v1
      options: --shm-size 16g
    timeout-minutes: 180
    environment: speco-npu-ci
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(github.event_name == 'pull_request' && '{"include":[{"drafter":"dspark"}]}' || '{"include":[{"drafter":"eagle3"},{"drafter":"dflash"},{"drafter":"dspark"}]}') }}

    steps:
      - name: Check out verl-SpeCo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Install current verl-SpeCo checkout
        run: |
          python -m pip install --no-deps -e .
          python - <<'PY'
          import os
          from pathlib import Path

          import verl_speco

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          package = Path(verl_speco.__file__).resolve()
          print("verl_speco imported from", package)
          assert workspace in package.parents, (
              f"expected verl_speco from PR workspace {workspace}, got {package}"
          )
          PY

      - name: Prepare model cache
        run: |
          test -d ~/.cache/huggingface
          find ~/.cache/huggingface -maxdepth 2 -name config.json -print
          find ~/.cache/huggingface -maxdepth 1 -name "*.parquet" -print

      - name: Verify model and dataset paths
        env:
          SPECO_TARGET_MODEL: ${{ inputs.target_model || env.SPECO_DEFAULT_TARGET_MODEL }}
          SPECO_EAGLE3_DRAFT_MODEL: ${{ inputs.eagle3_draft_model || env.SPECO_DEFAULT_EAGLE3_DRAFT_MODEL }}
          SPECO_DFLASH_DRAFT_MODEL: ${{ inputs.dflash_draft_model || env.SPECO_DEFAULT_DFLASH_DRAFT_MODEL }}
          SPECO_DSPARK_DRAFT_MODEL: ${{ inputs.dspark_draft_model || env.SPECO_DEFAULT_DSPARK_DRAFT_MODEL }}
          SPECO_TRAIN_FILE: ${{ inputs.train_file || env.SPECO_DEFAULT_TRAIN_FILE }}
          SPECO_TEST_FILE: ${{ inputs.test_file || env.SPECO_DEFAULT_TEST_FILE }}
        run: |
          expand_path() {
            case "$1" in
              "~") printf '%s\n' "${HOME}" ;;
              "~/"*) printf '%s/%s\n' "${HOME}" "${1#"~/"}" ;;
              *) printf '%s\n' "$1" ;;
            esac
          }

          SPECO_TARGET_MODEL="$(expand_path "${SPECO_TARGET_MODEL}")"
          SPECO_EAGLE3_DRAFT_MODEL="$(expand_path "${SPECO_EAGLE3_DRAFT_MODEL}")"
          SPECO_DFLASH_DRAFT_MODEL="$(expand_path "${SPECO_DFLASH_DRAFT_MODEL}")"
          SPECO_DSPARK_DRAFT_MODEL="$(expand_path "${SPECO_DSPARK_DRAFT_MODEL}")"
          SPECO_TRAIN_FILE="$(expand_path "${SPECO_TRAIN_FILE}")"
          SPECO_TEST_FILE="$(expand_path "${SPECO_TEST_FILE}")"

          case "${{ matrix.drafter }}" in
            eagle3)
              draft_model="${SPECO_EAGLE3_DRAFT_MODEL}"
              ;;
            dflash)
              draft_model="${SPECO_DFLASH_DRAFT_MODEL}"
              ;;
            dspark)
              draft_model="${SPECO_DSPARK_DRAFT_MODEL}"
              ;;
          esac

          test -d "${SPECO_TARGET_MODEL}" || {
            echo "Missing target model directory: ${SPECO_TARGET_MODEL}" >&2
            exit 2
          }
          test -d "${draft_model}" || {
            echo "Missing ${{ matrix.drafter }} draft model directory: ${draft_model}" >&2
            exit 2
          }
          test -f "${SPECO_TRAIN_FILE}" || {
            echo "Missing training dataset file: ${SPECO_TRAIN_FILE}" >&2
            exit 2
          }
          test -f "${SPECO_TEST_FILE}" || {
            echo "Missing validation dataset file: ${SPECO_TEST_FILE}" >&2
            exit 2
          }

      - name: Verify NPU runtime
        run: |
          npu-smi info
          python - <<'PY'
          import torch
          import torch_npu
          assert torch.npu.is_available()
          print("torch.npu.device_count =", torch.npu.device_count())
          PY
          python -c "import vllm; print(vllm.__version__)"

      - name: Run example script
        env:
          PYTHONPATH: ${{ github.workspace }}
          SPECO_TARGET_MODEL: ${{ inputs.target_model || env.SPECO_DEFAULT_TARGET_MODEL }}
          SPECO_EAGLE3_DRAFT_MODEL: ${{ inputs.eagle3_draft_model || env.SPECO_DEFAULT_EAGLE3_DRAFT_MODEL }}
          SPECO_DFLASH_DRAFT_MODEL: ${{ inputs.dflash_draft_model || env.SPECO_DEFAULT_DFLASH_DRAFT_MODEL }}
          SPECO_DSPARK_DRAFT_MODEL: ${{ inputs.dspark_draft_model || env.SPECO_DEFAULT_DSPARK_DRAFT_MODEL }}
          SPECO_TRAIN_FILE: ${{ inputs.train_file || env.SPECO_DEFAULT_TRAIN_FILE }}
          SPECO_TEST_FILE: ${{ inputs.test_file || env.SPECO_DEFAULT_TEST_FILE }}
          SPECO_CKPT_DIR: ${{ vars.SPECO_CKPT_DIR || runner.temp }}
          SPECO_ACCELERATOR_COUNT: ${{ inputs.accelerator_count || env.SPECO_DEFAULT_ACCELERATOR_COUNT }}
          SPECO_TENSOR_PARALLEL_SIZE: ${{ inputs.tensor_parallel_size || env.SPECO_DEFAULT_TENSOR_PARALLEL_SIZE }}
          SPECO_SEQUENCE_PARALLEL_SIZE: ${{ inputs.sequence_parallel_size || env.SPECO_DEFAULT_SEQUENCE_PARALLEL_SIZE }}
          SPECO_ENABLE_TRAINING: ${{ (github.event_name == 'schedule' || github.event_name == 'pull_request') && 'true' || inputs.run_training }}
          SPECO_TOTAL_TRAINING_STEPS: ${{ github.event_name == 'pull_request' && '1' || vars.SPECO_TOTAL_TRAINING_STEPS }}
          SPECO_TRAIN_MAX_SAMPLES: ${{ github.event_name == 'pull_request' && '1' || vars.SPECO_TRAIN_MAX_SAMPLES }}
          SPECO_VAL_MAX_SAMPLES: ${{ github.event_name == 'pull_request' && '1' || vars.SPECO_VAL_MAX_SAMPLES }}
          SPECO_DATALOADER_NUM_WORKERS: ${{ github.event_name == 'pull_request' && '0' || vars.SPECO_DATALOADER_NUM_WORKERS }}
          SPECO_EXTRA_HYDRA_ARGS: ${{ inputs.extra_hydra_args || vars.SPECO_EXTRA_HYDRA_ARGS }}
        run: |
          expand_path() {
            case "$1" in
              "~") printf '%s\n' "${HOME}" ;;
              "~/"*) printf '%s/%s\n' "${HOME}" "${1#"~/"}" ;;
              *) printf '%s\n' "$1" ;;
            esac
          }

          export SPECO_TARGET_MODEL="$(expand_path "${SPECO_TARGET_MODEL}")"
          export SPECO_EAGLE3_DRAFT_MODEL="$(expand_path "${SPECO_EAGLE3_DRAFT_MODEL}")"
          export SPECO_DFLASH_DRAFT_MODEL="$(expand_path "${SPECO_DFLASH_DRAFT_MODEL}")"
          export SPECO_DSPARK_DRAFT_MODEL="$(expand_path "${SPECO_DSPARK_DRAFT_MODEL}")"
          export SPECO_TRAIN_FILE="$(expand_path "${SPECO_TRAIN_FILE}")"
          export SPECO_TEST_FILE="$(expand_path "${SPECO_TEST_FILE}")"

          bash ci/run_example_test.sh npu vllm "${{ matrix.drafter }}"
