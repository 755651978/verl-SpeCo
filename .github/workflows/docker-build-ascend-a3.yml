name: docker-build-ascend-a3

on:
  workflow_dispatch:
  # push:
  #   branches: ["main"]
  #   paths:
  #     - "docker/ascend/Dockerfile.ascend_9.0.0_a3"
  #     - ".github/workflows/docker-build-ascend-a3.yml"
  # schedule:
  #   - cron: "0 19 * * *"

env:
  QUAY_REPO: quay.io/ascend/verl_speco
  IMAGE_TAG: latest-speco-cann9.0.0-torch_npu2.9.0post2-a3-ubuntu22.04-py3.11-vllm

jobs:
  build-push-digest:
    name: build-${{ matrix.tag }}
    if: ${{ github.event_name != 'pull_request' && github.repository_owner == 'verl-project' }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.tag }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: linux/amd64
            runner: ubuntu-latest
            tag: amd64
          - arch: linux/arm64
            runner: ubuntu-22.04-arm
            tag: arm64
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true

      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true
          driver: docker-container
          use: true

      - name: Log in to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Clean Docker cache
        run: docker system prune -a -f --volumes || true

      - name: Build and push image by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/ascend/Dockerfile.ascend_9.0.0_a3
          platforms: ${{ matrix.arch }}
          push: true
          outputs: type=image,name=${{ env.QUAY_REPO }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            http_proxy=${{ secrets.HTTP_PROXY }}
            https_proxy=${{ secrets.HTTPS_PROXY }}

      - name: Export image digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.tag }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-image:
    name: merge
    runs-on: ubuntu-latest
    needs: build-push-digest
    permissions:
      contents: read
    steps:
      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create and push multi-arch manifest
        env:
          IMAGE: ${{ env.QUAY_REPO }}
          TAG: ${{ env.IMAGE_TAG }}
        run: |
          DIGESTS=$(printf "$IMAGE@sha256:%s " $(ls "${{ runner.temp }}/digests"))
          echo "Image digests: $DIGESTS"
          docker buildx imagetools create \
            -t "$IMAGE:$TAG" \
            $DIGESTS
